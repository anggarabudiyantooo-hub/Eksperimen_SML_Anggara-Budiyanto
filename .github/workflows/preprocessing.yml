# jalan tiap ada push (atau run manual dari tab Actions):
# preprocessing dijalankan, lalu dataset hasilnya di-commit balik ke repo
name: Preprocessing Otomatis

on:
  push:
  workflow_dispatch:

# izin menulis, supaya bisa commit + push hasil dataset
permissions:
  contents: write

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install library yang dipakai script preprocessing
        run: pip install pandas scikit-learn numpy

      - name: Jalankan preprocessing otomatis
        run: python preprocessing/automate_Anggara-Budiyanto.py

      - name: Commit dataset hasil preprocessing ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/telco_churn_preprocessing.csv preprocessing/kolom_fitur.json
          git commit -m "update dataset hasil preprocessing (otomatis dari workflow)" || echo "tidak ada perubahan, skip commit"
          git push
